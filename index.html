<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOBF App</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial;overflow:hidden}
.header{height:60px;background:#111;display:flex;align-items:center;padding:0 15px;position:fixed;top:0;left:0;right:0;z-index:100;border-bottom:1px solid #222}
.menu-btn{font-size:26px;cursor:pointer;color:#E6C86E}
.logo{flex:1;text-align:center;font-weight:bold;font-size:18px}
.main{margin-top:60px;padding:20px;text-align:center;height:calc(100vh - 60px);overflow-y:auto}
.balance{color:#888;font-size:13px;margin-top:10px}
.balance b{color:#fff;font-size:38px;display:block;margin-top:5px}
.coin{width:180px;height:180px;background:radial-gradient(circle at 30% 30%,#FFEB3B,#FF9800);border-radius:50%;margin:25px auto;display:flex;align-items:center;justify-content:center;font-size:80px;color:#4a2c00;font-weight:bold;box-shadow:0 0 50px rgba(255,215,0,0.5)}
.auto{color:#4CAF50;font-size:14px;margin-top:10px}
.buttons{display:flex;gap:10px;justify-content:center;margin-top:30px}
.btn{flex:1;padding:16px 5px;background:#1a1a1a;border:1.5px solid #C5A000;border-radius:14px;color:#E6C86E;font-weight:bold;font-size:14px;cursor:pointer}
.drawer{position:fixed;top:0;left:-85%;width:80%;max-width:300px;height:100%;background:#111;z-index:200;padding:20px;transition:0.3s ease;border-right:1px solid #222}
.drawer.open{left:0}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:none;z-index:150}
.overlay.show{display:block}
.row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #1e1e1e;font-size:15px}
.row b{color:#E6C86E}
.title{color:#C5A000;font-size:11px;margin:25px 0 10px 0;letter-spacing:1px}
</style>
</head>
<body>

<div class="header">
<div class="menu-btn" onclick="toggleMenu()">☰</div>
<div class="logo">DOBF App</div>
<div style="width:26px"></div>
</div>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="drawer" id="drawer">
<div style="font-size:20px;margin-bottom:10px">☰ Menu</div>
<div class="title">MINING INFO</div>
<div class="row"><span>Level</span><b id="level">Level 1</b></div>
<div class="row"><span>Rate per hour</span><b id="rate">+36 D/hr</b></div>
<div class="row"><span>Balance</span><b id="bal2">9.40 D</b></div>
<div class="title">MENU</div>
<div class="row"><span>📊 Dashboard</span><span>></span></div>
<div class="row"><span>🎯 Tasks</span><span>></span></div>
<div class="row"><span>👥 Referrals</span><span>></span></div>
<div class="row"><span>💼 Wallet</span><span>></span></div>
<div class="row"><span>⚙️ Settings</span><span>></span></div>
</div>

<div class="main">
<div class="balance">Balance<b id="bal">9.40 D</b></div>
<div class="coin">D</div>
<div class="auto" id="autoText">● Auto Mining +0.01/sec</div>
<div class="buttons">
<button class="btn" onclick="doMine()">⛏️ MINE</button>
<button class="btn" onclick="alert('Buy coming soon!')">🛍️ BUY</button>
<button class="btn" onclick="alert('Withdraw soon!')">⬇️ WITHDRAW</button>
</div>
</div>

<script>
let bal=parseFloat(localStorage.getItem('dobf')||'9.40');
let lvl=parseInt(localStorage.getItem('lvl')||'1');
let rate=36;
function render(){
document.getElementById('bal').innerText=bal.toFixed(2)+' D';
document.getElementById('bal2').innerText=bal.toFixed(2)+' D';
document.getElementById('level').innerText='Level '+lvl;
document.getElementById('rate').innerText='+'+rate+' D/hr';
}
render();
setInterval(()=>{
bal+=0.01;
if(bal>lvl*100){lvl++;rate+=15;}
localStorage.setItem('dobf',bal);
localStorage.setItem('lvl',lvl);
render();
},1000);
function toggleMenu(){
document.getElementById('drawer').classList.toggle('open');
document.getElementById('overlay').classList.toggle('show');
}
function doMine(){bal+=0.10;render();localStorage.setItem('dobf',bal)}
</script>
</body>
</html>

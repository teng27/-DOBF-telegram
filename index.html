<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOBF Tesla Mining</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:400px;padding:20px;text-align:center}
.coin{width:200px;height:200px;margin:20px auto;border-radius:50%;background:radial-gradient(circle at 30% 30%,#FFE55C,#FFA500);border:4px solid gold;display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px gold;animation:s 2s linear infinite}
@keyframes s{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
.bal{font-size:32px;color:gold;font-weight:900;margin:10px}
.btn{width:100%;padding:18px;background:linear-gradient(135deg,gold,orange);border:0;border-radius:14px;font-size:18px;font-weight:900;color:#000}
</style>
</head>
<body>
<div class="app">
<div class="coin"><h1 style="color:#000;font-size:42px">DOBF</h1></div>
<div style="color:cyan">⚡ TESLA OVERDRIVE ACTIVE</div>
<div class="bal" id="bal">0.000000</div>
<div>Balance DOBF</div>
<button class="btn" id="btn" onclick="mine()">⚡ START MINING</button>
</div>
<script>
let b=parseFloat(localStorage.getItem('dobf')||0);
let m=false,t;
document.getElementById('bal').innerText=b.toFixed(6);
function mine(){
let bt=document.getElementById('btn');
if(!m){m=true;bt.innerText='⛏️ MINING...';t=setInterval(()=>{b+=0.005;localStorage.setItem('dobf',b);document.getElementById('bal').innerText=b.toFixed(6)},1000)}else{m=false;bt.innerText='⚡ START MINING';clearInterval(t)}
}
if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}
setTimeout(mine,1000);
</script>
</body>
</html>

<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOBF Mining</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff;display:flex;justify-content:center}.app{width:100%;max-width:420px;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#2a2000 0%,#000 70%);display:flex;flex-direction:column}.top{height:52px;background:#111;border-bottom:2px solid #FFD700;display:flex;align-items:center;padding:0 12px;gap:10px}.mine{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px}.coin-stage{width:300px;height:300px;position:relative;display:flex;align-items:center;justify-content:center}.glow{position:absolute;width:340px;height:340px;background:radial-gradient(circle,rgba(255,215,0,.5) 0%,transparent 70%);border-radius:50%;animation:glow 2s infinite}.coin{width:260px;height:260px;border-radius:50%;animation:float 3s ease-in-out infinite,spin 5s linear infinite;box-shadow:0 0 60px gold;cursor:pointer}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}@keyframes spin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}@keyframes glow{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.2);opacity:1}}.bottom{background:#111;padding:14px;border-top:2px solid #222;border-radius:20px 20px 0 0}.bal{font-size:28px;color:#FFD700;font-weight:900}</style></head><body><div class="app"><div class="top"><div style="font-weight:900;color:#FFD700">DOBF Mining</div><div style="margin-left:auto;font-size:11px;color:#0f0">● TELEGRAM</div></div><div class="mine"><div class="coin-stage"><div class="glow"></div><img id="coin" class="coin" src="dobf-coin-embedded.png.png"></div><div style="font-size:10px;color:#666;letter-spacing:2px">A DREAM OF A BRIGHT FUTURE</div></div><div class="bottom"><div style="display:flex;justify-content:space-between"><span style="color:#888;font-size:11px">Balance</span><span id="rate" style="color:#FFD700">+0.15/hr</span></div><div class="bal" id="bal">0.0342 DOBF</div></div></div><script>let bal=0.0342;function refresh(){document.getElementById('bal').innerText=bal.toFixed(4)+' DOBF'}refresh();setInterval(()=>{bal+=0.15/3600/10;refresh()},100);document.getElementById('coin').addEventListener('click',()=>{bal+=0.001;refresh()});if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}</script></body></html>
